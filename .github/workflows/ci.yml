name: ERP SYS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  verify:
    name: TypeScript and Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web-admin/package-lock.json
            apps/desktop-pos/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Install Web Admin dependencies
        run: npm ci --prefix apps/web-admin

      - name: Install Desktop POS dependencies
        run: npm ci --prefix apps/desktop-pos

      - name: Run project checks
        run: npm run check
